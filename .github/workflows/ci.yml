name: ci-deploy
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm test
      - run: npm run bench
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test || true
      - name: Build image (ECS push in AWS via OIDC)
        run: docker build -t hiring-workflow .
      # Real deploy: aws-actions/configure-aws-credentials + amazon-ecs-deploy-task-definition
      # with task-definition infra/task-def.json; CloudWatch alarm in infra/main.tf
